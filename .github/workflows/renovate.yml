name: Renovate

# Self-hosted Renovate: one grouped PR every Monday, or on demand from the
# Actions tab ("Run workflow") or `gh workflow run renovate.yml`.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # Lets pnpm reach the Hugeicons Pro registry when it updates the lockfile
          RENOVATE_HOST_RULES: '[{"matchHost":"npm.hugeicons.com","hostType":"npm","token":"${{ secrets.HUGEICONS_TOKEN }}"}]'
          LOG_LEVEL: info
